  <<: *defaults
  output_dir: outputs/1_deu
  training:
    <<: *training_defaults
    total_updates: 1800000
    batch_size: 5
    freeze_bert: true
    num_frozen_epochs: 1
  dataset:
    splits:
      train: train
      dev: validation
      test: test
    samples_train: 150000
    samples_dev: 18000
    name: de_hdt
  model:
    <<: *model_defaults
  wb:
    <<: *wandb_defaults

