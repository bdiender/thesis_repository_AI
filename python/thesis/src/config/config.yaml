### Basic anchors
defaults: &defaults
  cuda_device: 0
  seed: 1
  enable_wandb: false

training_defaults: &training_defaults
  batch_size: 8
  lr_model: 0.0001
  lr_classifier: 0.0005
  scheduler: cosine
  weight_decay: 0.01
  warmup_rate: 0.1
  freeze_classifier: false
  freeze_bert: false
  freeze_bert_until: 0

model_defaults: &model_defaults
  decoder:
    tag_repr_dim: 256
    arc_repr_dim: 768
    dropout: 0.2
  layer_dropout: 0.1

wandb_defaults: &wandb_defaults
  project: ai-thesis
  entity: entity-name

### Stage-specific defaults
dataset_stage2_common: &dataset_stage2_common
  splits:
    train: train
    dev: validation
    test: test
  samples_train: 10000
  samples_dev: 500
  number_of_updates: &stage2_updates 300

dataset_stage3_common: &dataset_stage3_common
  splits:
    train: train
    dev: dev
    test: test
  samples_train: 50
  samples_dev: 25
  number_of_updates: &stage3_updates 100

### Stage/language-specific defaults
stage2_nld_spec: &stage2_nld_spec
  training:
    <<: *training_defaults
    total_updates: *stage2_updates
  dataset:
    <<: *dataset_stage2_common
    name: nl_alpino

stage2_swe_spec: &stage2_swe_spec
  training:
    <<: *training_defaults
    total_updates: *stage2_updates  
  dataset:
    <<: *dataset_stage2_common
    name: sv_talbanken

stage2_ces_spec: &stage2_ces_spec
