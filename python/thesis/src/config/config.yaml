hpt_test:
  <<: *defaults
  output_dir: outputs/hp_sweep_test
  training:
    <<: *training_defaults
    total_updates: 100
    batch_size: 5
    freeze_bert: true
    num_frozen_epochs: 1
  dataset:
    splits:
      train: train
      dev: validation
      test: test
    samples_train: 100
    samples_dev: 10
    name: pt_gsd
  model:
    <<: *model_defaults
  wb:
    <<: *wandb_defaults

hyperpar_tuning:
  <<: *defaults
  output_dir: outputs/hp_sweep
  training:
    <<: *training_defaults
    total_updates: 95000
    batch_size: 5
    freeze_bert: true
    num_frozen_epochs: 1
  dataset:
    splits:
